resolver 127.0.0.11 ipv6=off valid=10s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ---------- AUTH ----------
  # Frontend calls /api/auth/* → auth-service expects /auth/*
  location ^~ /api/auth/ {
      # rewrite desired URI ONCE, then proxy with a single proxy_pass
      rewrite ^/api/auth/(login|register)$ /auth/$1 break;
      rewrite ^/api/auth/(.*)$           /$1       break;

      proxy_pass         http://auth-service:8084;
      proxy_http_version 1.1;

      proxy_set_header   Host                $host;
      proxy_set_header   X-Real-IP           $remote_addr;
      proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto   $scheme;
      proxy_set_header   Authorization       $http_authorization;
  }

  # ---------- TEAMS ----------
  # /api/teams/* → team-service expects /teams/*
  location ^~ /api/teams/ {
    rewrite ^/api/teams/(.*)$ /teams/$1 break;
    proxy_pass http://team-service:8083;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # Users belong to team-service too: /api/users/* → /users/*
  location ^~ /api/users/ {
    rewrite ^/api/users/(.*)$ /users/$1 break;
    proxy_pass http://team-service:8083;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # ---------- TASKS ----------
  # special-case: /api/tasks/teams/:teamId/tasks → /teams/:teamId/tasks
  location ~ ^/api/tasks/teams/([0-9]+)/tasks(.*)$ {
    proxy_pass http://task-service:8081/teams/$1/tasks$2;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # general tasks: /api/tasks/* → task-service expects /tasks/*
  location ^~ /api/tasks/ {
    rewrite ^/api/tasks/(.*)$ /tasks/$1 break;
    proxy_pass http://task-service:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # ---------- WebSocket ----------
  location /ws {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://realtime:8086/ws;
  }

  # ---------- SPA fallback ----------
  location / {
    try_files $uri /index.html;
  }
}
