server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ---------- AUTH ----------
  # /api/auth/login => http://auth-service:8084/login
  location ^~ /api/auth/ {
    proxy_pass http://auth-service:8084/auth/;  # note the `/auth/` here
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # ---------- TEAM ----------
  # /api/team/... => http://team-service:8083/...
  location ^~ /team-api/ {
    proxy_pass http://team-service:8083/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # ---------- TASK ----------
  # /api/task/... => http://task-service:8081/...
  location ^~ /task-api/ {
    proxy_pass http://task-service:8081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # ---------- WebSocket ----------
  # /ws => ws://realtime:8086/ws
  location /ws {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://realtime_service:8086/ws;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ---------- SPA fallback ----------
  location / {
    try_files $uri /index.html;
  }
}
