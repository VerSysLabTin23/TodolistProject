server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets directly
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
    }

    # SPA fallback: route everything else to index.html
    location / {
        try_files $uri /index.html;
    }
}


