resolver 127.0.0.11 ipv6=off valid=10s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ---------- AUTH ----------
  # /api/auth/login => http://auth-service:8084/auth/login
  location ^~ /api/auth/ {
    proxy_pass http://auth-service:8084/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # ---------- TEAMS ----------
  # /api/teams/... => http://team-service:8083/teams/...
  location ^~ /api/teams/ {
    proxy_pass http://team-service:8083/teams/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # ---------- USERS (team-service) ----------
  # /api/users/:userId/teams => http://team-service:8083/users/:userId/teams
  location ^~ /api/users/ {
      proxy_pass http://team-service:8083/users/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
  }

  # ---------- TASKS ----------
  # Special-case team tasks to preserve path semantics
  location ~ ^/api/tasks/teams/([0-9]+)/tasks(.*)$ {
    proxy_pass http://task-service:8081/teams/$1/tasks$2;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # General tasks endpoints: /api/tasks/... => http://task-service:8081/tasks/...
  location ^~ /api/tasks/ {
    proxy_pass http://task-service:8081/tasks/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # ---------- WebSocket ----------
  # /ws => ws://realtime:8086/ws
  location /ws {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://realtime:8086/ws;   # <-- fixed service name
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ---------- SPA fallback ----------
  location / {
    try_files $uri /index.html;
  }
}
